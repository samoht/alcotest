name: build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        packages:
          - "."
        runtest:
          - true
        ocaml-compiler:
          - "5.x"
          - "4.14"
        include:
          - os: macos-latest
            ocaml-compiler: "4.14"
            packages: "."
            runtest: true

          - os: windows-latest
            ocaml-compiler: "4.14"
            packages: "alcotest alcotest-js alcotest-lwt alcotest-mirage"
            opam-local-packages: "alcotest.opam alcotest-js.opam alcotest-lwt.opam alcotest-mirage.opam"
            runtest: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set-up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-local-packages: ${{ matrix.opam-local-packages }}
          opam-repositories: "${{ matrix.opam-repositories || 'default: https://opam.ocaml.org' }}"

      - run: opam install ${{ matrix.packages }} ${{ matrix.os != 'windows-latest' && '--with-test' || '' }} --deps-only
      - if: ${{ matrix.runtest }}
        run: opam exec -- dune build @install @check @runtest @runtest-js

  lower-bound:
    name: build (ubuntu-latest, 4.08)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # opam-repository dropped compilers older than 4.11.
      - name: Set-up OCaml 4.08
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.08"
          opam-repositories: |
            default: https://opam.ocaml.org
            archive: https://github.com/ocaml/opam-repository-archive.git

      # alcotest-async requires OCaml >= 4.14.
      - run: opam install ./alcotest.opam ./alcotest-js.opam ./alcotest-lwt.opam ./alcotest-mirage.opam --deps-only

      - run: opam exec -- dune build -p alcotest,alcotest-js,alcotest-lwt,alcotest-mirage @install
