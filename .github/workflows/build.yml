name: build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.ocaml-compiler }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ocaml-compiler: "5"
          - os: macos-latest
            ocaml-compiler: "5"
          - os: windows-latest
            ocaml-compiler: "5"
            # alcotest-async depends on core_unix, which does not support
            # Windows.
            opam-files: ./alcotest.opam ./alcotest-js.opam ./alcotest-lwt.opam ./alcotest-mirage.opam
            dune-flags: --only-packages alcotest,alcotest-js,alcotest-lwt,alcotest-mirage
          # alcotest-async lower bound
          - os: ubuntu-latest
            ocaml-compiler: "4.14"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set-up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      # conf-npm checks for npm by running "npm --version", but opam on
      # Windows only resolves .exe commands and npm is a .cmd shim there.
      # npm is provided by setup-node above, so register conf-npm without
      # running its check.
      - name: Register npm with opam
        if: runner.os == 'Windows'
        run: opam install conf-npm --fake

      - run: opam install ${{ matrix.opam-files || '.' }} --deps-only --with-test

      # The aliases are quoted because PowerShell, the default shell on
      # Windows, reads a bare @name as splatting the variable $name.
      - run: opam exec -- dune build ${{ matrix.dune-flags }} '@install' '@check' '@runtest'

      # The js_of_ocaml backend does not work on Windows yet: absolute paths
      # are mangled and caml_unix_filedescr_of_channel is missing.
      - if: runner.os != 'Windows'
        run: opam exec -- dune build '@runtest-js'

  lower-bound:
    name: build (ubuntu-latest, 4.08)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # opam-repository dropped compilers older than 4.11.
      - name: Set-up OCaml 4.08
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.08"
          opam-repositories: |
            default: https://opam.ocaml.org
            archive: https://github.com/ocaml/opam-repository-archive.git

      # alcotest-async requires OCaml >= 4.14.
      - run: opam install ./alcotest.opam ./alcotest-js.opam ./alcotest-lwt.opam ./alcotest-mirage.opam --deps-only

      - run: opam exec -- dune build -p alcotest,alcotest-js,alcotest-lwt,alcotest-mirage @install
